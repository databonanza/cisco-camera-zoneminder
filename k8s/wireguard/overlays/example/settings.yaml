apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wireguard
spec:
  template:
    spec:
      containers:
        - name: wireguard
          env:
            - name: SERVERURL
              value: vpn.example.net
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: phone,laptop
            - name: INTERNAL_SUBNET
              value: 10.13.13.0
            - name: ALLOWEDIPS
              value: 10.13.13.1/32,192.0.2.0/24
            - name: CAMERA_NETWORK
              value: 192.0.2.0/24
