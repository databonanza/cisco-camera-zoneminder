apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-from-zoneminder-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zoneminder-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zoneminder
      ports:
        - protocol: TCP
          port: 3306
