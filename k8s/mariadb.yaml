apiVersion: v1
kind: Service
metadata:
  name: zoneminder-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: zoneminder-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zoneminder-db
spec:
  serviceName: zoneminder-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zoneminder-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoneminder-db
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mariadb
          image: mariadb:11.8
          args:
            - --transaction-isolation=READ-COMMITTED
            - --skip-log-bin
          env:
            - name: TZ
              value: Etc/UTC
            - name: MARIADB_DATABASE
              value: zm
            - name: MARIADB_USER
              value: zmuser
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zoneminder-db
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zoneminder-db
                  key: MARIADB_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
